version: '3.8'

services:
  firefly-db:
    image: postgres:16
    container_name: firefly_db
    environment:
      POSTGRES_DB: firefly
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: firefly_secret
    volumes:
      - firefly_db_data:/var/lib/postgresql/data
    networks:
      - firefly_net

  firefly:
    image: fireflyiii/core:latest
    container_name: firefly_iii
    depends_on:
      - firefly-db
    ports:
      - "8080:8080"
    environment:
      APP_KEY: S0m3R4nd0mStr1ngOf32Ch4rsExActly
      DB_HOST: firefly-db
      DB_PORT: 5432
      DB_CONNECTION: pgsql
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: firefly_secret
      APP_URL: http://localhost:8080
      TRUSTED_PROXIES: "**"
      TZ: America/New_York
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    networks:
      - firefly_net

volumes:
  firefly_db_data:
  firefly_upload:

networks:
  firefly_net:
    driver: bridge
